<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-education-{{ education.id }}"
            aria-label="Delete {{ Education.title }}"
            title="Delete Education">
        Delete Education
    </button>
</p>
<div id="delete-education-{{ education.id }}"
     class="project-education-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-education-title-{{ project.id }}">
    <button type="button"
            class="project-education-modal__backdrop"
            popovertarget="delete-education-{{ education.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="project-education-modal__content">
        <button type="button"
                class="project-education-modal__close"
                popovertarget="delete-education-{{ education.id }}"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
        <h2 id="delete-education-title-{{ education.id }}">Delete Education</h2>
        <p>
            Delete?
            <strong>{{ education.title }}</strong>?
        </p>
        <div class="education-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-education-{{ project.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_education' education.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Delete</button>
            </form>
        </div>
    </div>
</div>
