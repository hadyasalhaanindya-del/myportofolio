{% extends 'base.html' %}
{% block content %}

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
        
                    <h1>
                        Hi! I'm<br>
                        <span class="hadya-font">{{ name }}</span>
                    </h1>
                </div>
                <div class="hero-photo">
                    <img class="avatar" src="{% static 'img/hadya.jpeg' %}" alt="Photo of {{ name }}">
                    <img class="photo-frame" src="{% static 'img/pinkframe.png' %}" alt="Photo frame">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Major</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/hadyasalhaanindya-del" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/hadyasalha-alina-anindya-223949378/" class="social-link">LinkedIn</a>
                        <a href="mailto:hadyasalha.anindya@gmail.com" class="social-link">Email</a>
                    </div>
                    
            </div><!-- hero-details-->
            </div><!-- container hero-grid-->
        </section>
    </main>
{% endblock content %}
